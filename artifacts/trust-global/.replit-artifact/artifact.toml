kind = "web"
previewPath = "/"
title = "Trust Global Finance"
version = "1.0.0"
id = "artifacts/trust-global"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 25830
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/trust-global run dev"

[services.env]
PORT = "25830"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/trust-global", "run", "build"]
publicDir = "artifacts/trust-global/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
